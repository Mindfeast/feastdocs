# nginx for a prerendered FeastDocs build.
#
# Used by the Dockerfile, and equally valid as a site config on a plain Linux
# server — point `root` at wherever you copied dist/feastdocs/browser.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Prerendered pages are real files (/guide/markdown/index.html). Serve the
  # exact file, then the folder's index.html, and only then fall back to the
  # SPA shell so client-side routes still resolve. Without that final fallback
  # every deep link 404s on refresh.
  location / {
    try_files $uri $uri/index.html /index.html;
  }

  # Build assets carry a content hash in their name, so they can never go
  # stale: cache them for a year.
  location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
  }

  # HTML and the search index are not hashed — they must revalidate, or a
  # deploy goes unnoticed by browsers that already have them.
  location ~* \.(?:html|json|xml|txt)$ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
}
