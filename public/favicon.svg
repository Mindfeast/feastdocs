<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FeastDocs">
  <!--
    FeastDocs mark, vector recreation of the brand icon: a document with an
    amber fold, structured content rows, and a node graph branching out of the
    page — structured knowledge being generated. Dashed arc = the build loop.
  -->

  <!-- Charcoal disc -->
  <circle cx="256" cy="256" r="208" fill="#262b34"/>

  <!-- Dashed build arc with a solid waypoint dot -->
  <path
    d="M 334 88 A 185 185 0 1 1 88 334"
    fill="none" stroke="#f18a1e" stroke-width="14" stroke-linecap="round"
    stroke-dasharray="185 145 999"
  />
  <circle cx="329" cy="426" r="16" fill="#f18a1e"/>

  <!-- Document outline with folded corner -->
  <path
    d="M 190 130 H 296 L 348 182 V 366 Q 348 382 332 382 H 190 Q 174 382 174 366 V 146 Q 174 130 190 130 Z"
    fill="#262b34" stroke="#ffffff" stroke-width="15" stroke-linejoin="round"
  />
  <path
    d="M 296 130 L 348 182 H 312 Q 296 182 296 166 Z"
    fill="#f18a1e" stroke="#ffffff" stroke-width="15" stroke-linejoin="round"
  />

  <!-- Content: amber heading, then dotted rows -->
  <rect x="196" y="206" width="76" height="17" rx="8.5" fill="#f18a1e"/>

  <circle cx="201" cy="252" r="8.5" fill="#f18a1e"/>
  <rect x="218" y="243.5" width="92" height="17" rx="8.5" fill="#ffffff"/>

  <circle cx="201" cy="298" r="8.5" fill="#f18a1e"/>
  <rect x="218" y="289.5" width="92" height="17" rx="8.5" fill="#ffffff"/>

  <circle cx="201" cy="344" r="8.5" fill="#f18a1e"/>
  <rect x="218" y="335.5" width="92" height="17" rx="8.5" fill="#ffffff"/>

  <!-- The branch: content flowing out of the page as connected nodes -->
  <path d="M 330 298 H 354" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  <path d="M 354 298 L 404 266 M 354 298 L 398 338" fill="none" stroke="#f18a1e" stroke-width="13" stroke-linecap="round"/>
  <circle cx="412" cy="261" r="17" fill="#f18a1e"/>
  <circle cx="404" cy="343" r="13" fill="#f18a1e"/>
</svg>
