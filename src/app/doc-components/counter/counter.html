<div class="fd-counter">
  <button type="button" class="fd-counter__button" aria-label="Decrease" (click)="add(-1)">
    &minus;
  </button>
  <output class="fd-counter__value">{{ value() }}</output>
  <button type="button" class="fd-counter__button" aria-label="Increase" (click)="add(1)">
    +
  </button>
</div>
